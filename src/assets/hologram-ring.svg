<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
<defs>
  <filter id="holoGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur1" />
    <feGaussianBlur stdDeviation="6" result="blur2" />
    <feMerge>
      <feMergeNode in="blur2" />
      <feMergeNode in="blur1" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="activeGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur1" />
    <feGaussianBlur stdDeviation="10" result="blur2" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.64  0 0 0 0 0.96  0 0 0 0 0.21  0 0 0 1 0" in="blur2" result="coloredBlur" />
    <feMerge>
      <feMergeNode in="coloredBlur" />
      <feMergeNode in="blur1" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <linearGradient id="activeWedgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#84cc16" stop-opacity="0.85" />
    <stop offset="50%" stop-color="#4d7c0f" stop-opacity="0.7" />
    <stop offset="100%" stop-color="#1f3d05" stop-opacity="0.85" />
  </linearGradient>
  <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#bef264" stop-opacity="0.55" />
    <stop offset="60%" stop-color="#84cc16" stop-opacity="0.42" />
    <stop offset="100%" stop-color="#65a30d" stop-opacity="0.5" />
  </linearGradient>
  <radialGradient id="discBackdrop" cx="50%" cy="50%" r="50%">
    <stop offset="40%" stop-color="#84cc16" stop-opacity="0.05" />
    <stop offset="70%" stop-color="#65a30d" stop-opacity="0.2" />
    <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0.08" />
  </radialGradient>
  <!-- 6 Portfolio Section Symbols from Lucide -->
  <g id="sym-about" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="5" />
    <path d="M20 21a8 8 0 0 0-16 0" />
  </g>
  <g id="sym-skills" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 16 4-4-4-4" />
    <path d="m6 8-4 4 4 4" />
    <path d="m14.5 4-5 16" />
  </g>
  <g id="sym-projects" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z" />
    <path d="M8 10v4" />
    <path d="M12 10v2" />
    <path d="M16 10v6" />
  </g>
  <g id="sym-experience" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 12h.01" />
    <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
    <path d="M22 13a18.15 18.15 0 0 1-20 0" />
    <rect width="20" height="14" x="2" y="6" rx="2" />
  </g>
  <g id="sym-education" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7v14" />
    <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
  </g>
  <g id="sym-contact" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="20" height="16" x="2" y="4" rx="2" />
    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
  </g>
</defs>
<!-- Hologram Ambient Halo Glows -->
<circle cx="250" cy="250" r="208" stroke="#a3e635" stroke-width="4" opacity="0.2" filter="url(#holoGlow)" />
<circle cx="250" cy="250" r="128" stroke="#a3e635" stroke-width="3" opacity="0.2" filter="url(#holoGlow)" />
<circle cx="250" cy="250" r="205" fill="url(#discBackdrop)" />
<g id="hologram-rotating-wheel" class="hologram-wheel">
  <path d="M 152.18 69.84 A 205 205 0 0 1 347.82 69.84 L 312.03 135.75 A 130 130 0 0 0 187.97 135.75 Z" fill="rgba(132, 204, 22, 0.16)" stroke="rgba(163, 230, 53, 0.28)" stroke-width="1" class="holo-sector holo-sector-0" />
  <path d="M 357.11 75.21 A 205 205 0 0 1 454.93 244.63 L 379.96 246.60 A 130 130 0 0 0 317.92 139.16 Z" fill="rgba(132, 204, 22, 0.16)" stroke="rgba(163, 230, 53, 0.28)" stroke-width="1" class="holo-sector holo-sector-1" />
  <path d="M 454.93 255.37 A 205 205 0 0 1 357.11 424.79 L 317.92 360.84 A 130 130 0 0 0 379.96 253.40 Z" fill="rgba(132, 204, 22, 0.16)" stroke="rgba(163, 230, 53, 0.28)" stroke-width="1" class="holo-sector holo-sector-2" />
  <path d="M 347.82 430.16 A 205 205 0 0 1 152.18 430.16 L 187.97 364.25 A 130 130 0 0 0 312.03 364.25 Z" fill="rgba(132, 204, 22, 0.16)" stroke="rgba(163, 230, 53, 0.28)" stroke-width="1" class="holo-sector holo-sector-3" />
  <path d="M 142.89 424.79 A 205 205 0 0 1 45.07 255.37 L 120.04 253.40 A 130 130 0 0 0 182.08 360.84 Z" fill="rgba(132, 204, 22, 0.16)" stroke="rgba(163, 230, 53, 0.28)" stroke-width="1" class="holo-sector holo-sector-4" />
  <path d="M 45.07 244.63 A 205 205 0 0 1 142.89 75.21 L 182.08 139.16 A 130 130 0 0 0 120.04 246.60 Z" fill="rgba(132, 204, 22, 0.16)" stroke="rgba(163, 230, 53, 0.28)" stroke-width="1" class="holo-sector holo-sector-5" />
  <circle cx="250" cy="250" r="168" stroke="rgba(190, 242, 100, 0.35)" stroke-width="1.5" stroke-dasharray="4 3" fill="none" />
  <circle cx="250" cy="250" r="192" stroke="rgba(163, 230, 53, 0.25)" stroke-width="1" stroke-dasharray="2 4" fill="none" />
  <line x1="314.50" y1="138.28" x2="353.00" y2="71.60" stroke="#193504" stroke-width="3" />
  <line x1="314.50" y1="138.28" x2="353.00" y2="71.60" stroke="#a3e635" stroke-width="1" opacity="0.8" />
  <line x1="379.00" y1="250.00" x2="456.00" y2="250.00" stroke="#193504" stroke-width="3" />
  <line x1="379.00" y1="250.00" x2="456.00" y2="250.00" stroke="#a3e635" stroke-width="1" opacity="0.8" />
  <line x1="314.50" y1="361.72" x2="353.00" y2="428.40" stroke="#193504" stroke-width="3" />
  <line x1="314.50" y1="361.72" x2="353.00" y2="428.40" stroke="#a3e635" stroke-width="1" opacity="0.8" />
  <line x1="185.50" y1="361.72" x2="147.00" y2="428.40" stroke="#193504" stroke-width="3" />
  <line x1="185.50" y1="361.72" x2="147.00" y2="428.40" stroke="#a3e635" stroke-width="1" opacity="0.8" />
  <line x1="121.00" y1="250.00" x2="44.00" y2="250.00" stroke="#193504" stroke-width="3" />
  <line x1="121.00" y1="250.00" x2="44.00" y2="250.00" stroke="#a3e635" stroke-width="1" opacity="0.8" />
  <line x1="185.50" y1="138.28" x2="147.00" y2="71.60" stroke="#193504" stroke-width="3" />
  <line x1="185.50" y1="138.28" x2="147.00" y2="71.60" stroke="#a3e635" stroke-width="1" opacity="0.8" />
  <!-- Sector 0 Symbol: sym-about -->
  <g transform="translate(250.00, 82.00) rotate(0) translate(-16, -16) scale(1.33)" class="holo-symbol holo-symbol-0" color="#bef264" filter="url(#holoGlow)">
    <use href="#sym-about" />
  </g>
  <!-- Sector 1 Symbol: sym-skills -->
  <g transform="translate(395.49, 166.00) rotate(60) translate(-16, -16) scale(1.33)" class="holo-symbol holo-symbol-1" color="#bef264" filter="url(#holoGlow)">
    <use href="#sym-skills" />
  </g>
  <!-- Sector 2 Symbol: sym-projects -->
  <g transform="translate(395.49, 334.00) rotate(120) translate(-16, -16) scale(1.33)" class="holo-symbol holo-symbol-2" color="#bef264" filter="url(#holoGlow)">
    <use href="#sym-projects" />
  </g>
  <!-- Sector 3 Symbol: sym-experience -->
  <g transform="translate(250.00, 418.00) rotate(180) translate(-16, -16) scale(1.33)" class="holo-symbol holo-symbol-3" color="#bef264" filter="url(#holoGlow)">
    <use href="#sym-experience" />
  </g>
  <!-- Sector 4 Symbol: sym-education -->
  <g transform="translate(104.51, 334.00) rotate(240) translate(-16, -16) scale(1.33)" class="holo-symbol holo-symbol-4" color="#bef264" filter="url(#holoGlow)">
    <use href="#sym-education" />
  </g>
  <!-- Sector 5 Symbol: sym-contact -->
  <g transform="translate(104.51, 166.00) rotate(300) translate(-16, -16) scale(1.33)" class="holo-symbol holo-symbol-5" color="#bef264" filter="url(#holoGlow)">
    <use href="#sym-contact" />
  </g>
</g><!-- end hologram-rotating-wheel -->
<!-- Lower Visor Arc (Omniverse Shield Bezel) -->
<g class="holo-visor">
  <path d="M 455.00 250.00 A 205 205 0 0 1 45.00 250.00 L 120.00 250.00 A 130 130 0 0 0 380.00 250.00 Z" fill="url(#visorGrad)" />
  <!-- Visor bright neon borders -->
  <path d="M 455.00 250.00 A 205 205 0 0 1 45.00 250.00" stroke="#d9f99d" stroke-width="4.5" stroke-linecap="round" filter="url(#holoGlow)" />
  <path d="M 380.00 250.00 A 130 130 0 0 1 120.00 250.00" stroke="#d9f99d" stroke-width="4" stroke-linecap="round" filter="url(#holoGlow)" />
  <!-- Visor vertical facet accents -->
  <line x1="364.32" y1="316.00" x2="425.80" y2="351.50" stroke="rgba(217, 249, 157, 0.4)" stroke-width="1.5" />
  <line x1="316.00" y1="364.32" x2="351.50" y2="425.80" stroke="rgba(217, 249, 157, 0.4)" stroke-width="1.5" />
  <line x1="250.00" y1="382.00" x2="250.00" y2="453.00" stroke="rgba(217, 249, 157, 0.4)" stroke-width="1.5" />
  <line x1="184.00" y1="364.32" x2="148.50" y2="425.80" stroke="rgba(217, 249, 157, 0.4)" stroke-width="1.5" />
  <line x1="135.68" y1="316.00" x2="74.20" y2="351.50" stroke="rgba(217, 249, 157, 0.4)" stroke-width="1.5" />
</g>
<!-- Inner Pointer Arrow (Omnitrix Selector Notch) -->
<g class="holo-pointer">
  <path d="M 164.06 151.13 L 200.19 170.28 L 198.81 129.41 Z" fill="#15803d" stroke="#a3e635" stroke-width="2" filter="url(#holoGlow)" />
  <polygon points="164.06,151.13 200.19,170.28 198.81,129.41" fill="#22c55e" opacity="0.85" />
</g>
<!-- Top Active Selector Panel (Popped-up Wedge) -->
<g class="holo-active-panel" filter="url(#activeGlow)">
  <!-- Outer glowing lime border -->
  <path d="M 150.26 36.11 A 236 236 0 0 1 349.74 36.11 L 303.25 135.81 A 126 126 0 0 0 196.75 135.81 Z" fill="url(#activeWedgeGrad)" stroke="#a3e635" stroke-width="4" stroke-linejoin="round" />
  <!-- Inner dark green bezel line -->
  <path d="M 164.22 37.67 A 229 229 0 0 1 335.78 37.67 L 300.20 125.76 A 134 134 0 0 0 199.80 125.76 Z" fill="none" stroke="#365314" stroke-width="2.5" opacity="0.9" />
  <!-- Top bright neon highlight arc -->
  <path d="M 150.26 36.11 A 236 236 0 0 1 349.74 36.11" stroke="#d9f99d" stroke-width="3" fill="none" />
  <!-- Bottom inner neon highlight arc -->
  <path d="M 303.25 135.81 A 126 126 0 0 0 196.75 135.81" stroke="#bef264" stroke-width="2.5" fill="none" />
  <!-- Active Symbol inside the raised panel (About: UserRound by default) -->
  <g class="holo-active-symbol" transform="translate(250, 72) translate(-20, -20) scale(1.67)" color="#ffffff" filter="url(#holoGlow)">
    <use href="#sym-about" stroke-width="2.4" />
  </g>
</g>
<!-- Base Ring Outlines -->
<circle cx="250" cy="250" r="205" stroke="#84cc16" stroke-width="2.5" fill="none" opacity="0.85" />
<circle cx="250" cy="250" r="130" stroke="#a3e635" stroke-width="2.5" fill="none" opacity="0.85" />
</svg>